name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The suite is self-contained: every instance is either generated by
      # benchmarks/synthetic.py or hand-written in the test. Nothing here touches
      # data/ or the network, so CI needs no dataset download.
      - run: pytest tests/ -q
