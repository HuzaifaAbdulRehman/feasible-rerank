name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt coverage

      # The suite is self-contained: every instance is either generated by
      # benchmarks/synthetic.py, written out by hand in the test, or -- for the real-data
      # pipeline -- built from a ratings CSV the test generates into tmp_path. Nothing
      # here touches data/ or the network, so CI needs no dataset download.
      - run: coverage run -m pytest tests/
      - run: coverage report
