# Exact versions every published number in this repository was produced with.
#
# `requirements.txt` states the *compatible* range, which is what a reader installing the
# project should use. This file states what was actually on the machine, which is what a
# reader trying to reproduce a specific figure needs -- and for a project whose argument
# is reproducibility, the difference matters. An independent audit noted that every line
# of requirements.txt was `>=`, no lockfile existed, and CI therefore installed whatever
# happened to be current on the day.
#
# Install with:
#     pip install -r requirements.lock
#
# Recorded on Python 3.10.11, Windows 10. Two of these are load-bearing beyond their
# version number:
#
#   dwave-samplers  TabuSampler's default stopping rule is a 20 ms wall clock, so its
#                   solution *quality* depends on the machine as well as the version.
#                   See qubo_rerank/solvers/tabu.py.
#   highspy         supplies the HiGHS backend that experiments/exact.py selects. Absent
#                   it, pulp silently falls back to nothing and the exact baseline fails
#                   rather than skipping.

