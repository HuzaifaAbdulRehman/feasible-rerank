# Packaging here is deliberately minimal. This is a research codebase run from a
# checkout, not a library anyone imports, so it carries metadata and supports an
# editable install -- and stops there. No PyPI release: claiming a name nobody will
# `pip install` costs something and buys nothing.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feasible-rerank"
version = "0.2.0"
description = "Fair, energy-aware recommendation list selection via QUBO"
readme = "README.md"
license = { file = "LICENSE" }
# 3.10 is the floor the code actually needs (zip(strict=) is the newest thing
# used) and is what it was developed against. Claiming 3.11 would have blocked
# installs in the environment the whole suite passes in.
requires-python = ">=3.10"
authors = [{ name = "Huzaifa Abdul Rehman" }]
keywords = [
    "recommender-systems",
    "quantum-annealing",
    "QUBO",
    "fairness",
    "green-computing",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dimod>=0.12",
    "dwave-neal>=0.6",
    "dwave-samplers>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "codecarbon>=2.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "coverage>=7.0", "ruff>=0.6"]

[tool.setuptools]
# experiments/ and benchmarks/ are scripts and data loaders driven from the command
# line, not importable library surface. Only the library is packaged.
packages = [
    "qubo_rerank",
    "qubo_rerank.formulations",
    "qubo_rerank.solvers",
    "qubo_rerank.metrics",
]

# `pythonpath = ["."]` is load-bearing. Without it `from qubo_rerank import ...`
# resolves only under `python -m pytest`, which prepends the working directory to
# sys.path; a bare `pytest tests/` -- which is what CI and most contributors run --
# fails at import. The suite passing locally is not evidence that it passes anywhere
# else.

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F are the baseline, I keeps imports ordered, UP catches syntax kept alive by habit,
# B catches the mutable-default and loop-variable-capture class of bug. Deliberately
# not the full rule set: this is a research repo, and a linter that objects to a
# hand-derived formula written the way the paper writes it is worse than no linter.
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    # The experiment drivers must insert the repo root on sys.path before importing
    # from it, because they are run as scripts rather than as an installed package.
    # That puts imports after code by necessity, not by accident.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Tests transcribe reference implementations and hand-worked examples; multiple
# statements on one line keep a 4x4 matrix looking like a 4x4 matrix.
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["qubo_rerank", "benchmarks", "experiments"]

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
